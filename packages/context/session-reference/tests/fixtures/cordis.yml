- name: '@noharness/session'
- name: '@noharness/system-prompt'
- name: '@noharness/tools'
- name: '@noharness/tool-executor-native'
- name: '@noharness/fs-local'
- name: '@noharness/session-projection'
- name: '@noharness/working-directory'
- name: '@noharness/tool-fs'
- name: '@noharness/session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never
- name: '@noharness/session-reference'
  config:
    maxReferenceBytes: 360
- name: './source-session.ts'
- name: '@noharness/spill-local'
  config:
    root: '{{spillRoot}}'
    cleanupPeriodDays: 0
