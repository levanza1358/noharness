- name: '@noharness/llm'
- name: '@noharness/session'
- name: '@noharness/session-projection'
- name: '@noharness/system-prompt'
- name: '@noharness/tools'
- name: '@noharness/tool-executor-native'
- name: '@noharness/agent'
- name: '@noharness/agent-loop'
  config:
    agents: []
- name: '@noharness/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@noharness/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@noharness/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
