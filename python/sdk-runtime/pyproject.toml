[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "noharness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled nhs CLI runtime for the NoHarness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/levanza1358/noharness"
Documentation = "https://github.com/levanza1358/noharness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/levanza1358/noharness/issues"
Source = "https://github.com/levanza1358/noharness"

[project.scripts]
nhs = "noharness_runtime:main"

# Include the injected nhs executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/noharness_runtime/runtime/noharness-sdk-runtime-*",
  "src/noharness_runtime/runtime/noharness-sdk-runtime-*/**",
  "src/noharness_runtime/runtime/linux-*/**",
  "src/noharness_runtime/runtime/macos-*/**",
  "src/noharness_runtime/runtime/win-*/**",
]
exclude = ["src/noharness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/noharness_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
