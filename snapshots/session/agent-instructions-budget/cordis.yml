# Workspace-context snapshot patch: the harness exports NHS_HOME=<cwd>/.nhs and
# NHS_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@noharness/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@noharness/session-persistence-jsonl'
  config:
    root: !!js nhsHomePath('sessions')
    compression: !!js 'process.env.NHS_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@noharness/agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .nhs-project

- id: system-prompt
  name: '@noharness/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
